name: Build Haushaltsbuch APK

on:
  push:
    branches:
      - haushaltsbuch-android
    paths:
      - 'android-haushaltsbuch/**'
      - '.github/workflows/haushaltsbuch-android.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0"

      - name: Setup Gradle 8.13
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.13'

      - name: Restore offline HTML asset
        working-directory: android-haushaltsbuch
        run: |
          cat app/src/main/assets/chunks/index.part.* | base64 --decode | gunzip > app/src/main/assets/index.html
          test -s app/src/main/assets/index.html

      - name: Build debug APK
        working-directory: android-haushaltsbuch
        run: gradle :app:assembleDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Haushaltsbuch-APK
          path: android-haushaltsbuch/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
